version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scribe-frontend-prod
    environment:
      - NEXT_PUBLIC_API_URL=https://scribe.illanes00.cl/api
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scribe-backend-prod
    environment:
      - DATABASE_URL=postgresql://scribe:${DB_PASSWORD}@db:5432/scribe
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ENVIRONMENT=production
    volumes:
      - exports:/app/exports
      - templates:/app/templates
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    container_name: scribe-db-prod
    environment:
      POSTGRES_USER: scribe
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: scribe
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scribe -d scribe"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: scribe-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/scribe.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - exports:/var/www/exports:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  exports:
  templates:
